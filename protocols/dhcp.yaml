name: dhcp
description: "DHCP DORA: DISCOVER -> OFFER -> REQUEST -> ACK"
sequence:
  - message: 1        # DISCOVER
    direction: 0
    packet_length: [300, 350]
    iat: [0.0001, 0.01]
  - message: 2        # OFFER
    direction: 1
    packet_length: [300, 400]
    iat: [0.001, 0.1]
  - message: 3        # REQUEST
    direction: 0
    packet_length: [300, 350]
    iat: [0.001, 0.1]
  - message: 5        # ACK
    direction: 1
    packet_length: [300, 400]
    iat: [0.001, 0.1]
