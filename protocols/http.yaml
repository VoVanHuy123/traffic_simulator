name: http
description: "HTTP over TCP: handshake -> request/response -> 2-step close"
sequence:
  # handshake
  - message: 2         # SYN
    direction: 0
    packet_length: [40, 60]
    iat: [0.0001, 0.01]
  - message: 18        # SYN-ACK
    direction: 1
    packet_length: [40, 60]
    iat: [0.0001, 0.05]
  - message: 16         # ACK
    direction: 0
    packet_length: [40, 60]
    iat: [0.0001, 0.01]
  # HTTP request/response
  - repeat:
      count: [1, 3]
      messages:
        - message: 24    # PSH-ACK: HTTP request
          direction: 0
          packet_length: [60, 300]
          iat: [0.001, 0.2]
        - message: 24    # PSH-ACK: HTTP response
          direction: 1
          packet_length: [100, 1400]
          iat: [0.001, 0.3]
  # closing
  - message: 17        # FIN-ACK
    direction: 0
    packet_length: [40, 60]
    iat: [0.001, 0.1]
  - message: 16        # ACK
    direction: 1
    packet_length: [40, 60]
    iat: [0.0001, 0.01]
